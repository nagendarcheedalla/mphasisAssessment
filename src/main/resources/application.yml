spring:
  application:
    name: transaction-processor
  datasource:
    url: jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
processor:
  max-attempts: 3
logging:
  level:
    com.mphasis.assessment: INFO
